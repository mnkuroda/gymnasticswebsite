


<!DOCTYPE html>

<html>
    <head>
        <meta name="viewport" content="width=device-width" />
        <title>Openings</title>
        <!-- render style-->
<style>
    

    div.jr-container {
        box-sizing:border-box
    }

    div.jr-container:before,div.jr-container:after {
        box-sizing: border-box
    }

    .responsive-table {
      font-family: inherit;
        color: black;
    }

    /* container styles */
    .jr-container {
        margin: 5% 3%;
    }

    .responsive-table {
        font-size: .9em;        
        border-spacing: 0;
        border-collapse: collapse;
    }            

    .responsive-table {
        width: 100%;
        margin-bottom: 1.5em;
    }

    .responsive-table thead {
        /*// Accessibly hide <thead> on narrow viewports*/
        position: absolute;
        clip: rect(1px 1px 1px 1px); /* IE6, IE7 */
        clip: rect(1px, 1px, 1px, 1px);
        padding: 0;
        border: 0;
        height: 1px;
        width: 1px;
        overflow: hidden;
    }    

    .responsive-table thead th {
      /*background-color: rgba(29,150,178,1);
      border: 1px solid rgba(29,150,178,1);*/
      /*font-weight: normal;*/
      text-align: center;
    }

    .responsive-table thead :first-child {
        text-align: left;
    }
        
    /*// Set these items to display: block for narrow viewports*/
    .responsive-table tbody,
    .responsive-table tr,
    .responsive-table th,
    .responsive-table td {
        display: block;
        padding: 0;
        text-align: left;
        white-space: normal;
    }    

    .responsive-table thead tr th,
    .responsive-table tbody tr td,
    .responsive-table tbody tr th {
        padding: .3em .5em;
        vertical-align: middle;
    }    

    .responsive-table tbody tr {
      margin-bottom: 1em;
      border: 2px solid rgba(94,93,82,1)

     }

    .responsive-table tbody tr:last-of-type {
        margin-bottom: 0;
    }

    .responsive-table tbody th[scope="row"],.responsive-table thead th[scope="col"].jr-header {
        text-align: left;
    }

    .responsive-table tbody td {
      text-align: right;
    }        

    .responsive-table tbody td[data-type=currency] {
      text-align: right;
    }

   .responsive-table tbody td[data-title]:before {
      content: attr(data-title);
      float: left;
      font-size: .8em;
      color: rgba(94, 93, 82, .75);
    }

    .responsive-table tbody td[data-title="Openings"],
    .responsive-table tbody td[data-title="Tuition"] {
        white-space: nowrap;
    }

    /* override register link styles */
    .responsive-table tbody td.jr-reg-col {
        
    }
    .responsive-table tbody td.jr-reg-col:before {
        content: '';
    }
 
    .responsive-table tbody td[data-title]:before {
        font-size: .9em;
    }
        
    /* add header style for mobile as well */
    @media (max-width: 474px) {
        .responsive-table tbody th {
            
        }
    }
    

    /* large table styles */
    @media (min-width: 475px) {
        .jr-container {
            margin: 2em auto;
        }
        
        .responsive-table tbody tr:nth-of-type(even) {
            background-color: rgba(94, 93, 82, 0.1);
        }

        .responsive-table tbody tr td[data-title="Description"], .responsive-table thead tr th[data-title="Description"] {
            text-align: left;
        }

        .responsive-table tbody tr td[data-title="Ages"], .responsive-table thead tr th[data-title="Ages"] {
            width: 90px;
        }

        .responsive-table tbody td[data-type=currency] {
            text-align: center;
        }


        .responsive-table {
            font-size: 10pt;
            line-height: 1.5em; 
        }

        .responsive-table thead {
            /*// Unhide <thead> on wide viewports*/
            position: relative;
            clip: auto;
            height: auto;
            width: auto;
            overflow: auto;
        }

        .responsive-table tbody :first-child, .responsive-table thead :first-child {
            text-align: center;
        }

        .responsive-table tr {
            /*// Undo display: block*/
            display: table-row;
        }

        .responsive-table th,
        .responsive-table td {
            /*// Undo display: block*/
            display: table-cell;
        }

        .responsive-table tbody {
            /*// Undo display: block*/
            display: table-row-group;
        }

        .responsive-table tbody tr {
            border: none;
        }

        .responsive-table tbody tr {
            /*// Undo display: block*/
            display: table-row;
            border-width: 1px;
        }
    
        .responsive-table tbody th[scope="row"] {
            background-color: transparent;
            color: rgba(00,00,00,1);
            font-weight: normal;
            
                          
        }
    
        .responsive-table tbody td {
            text-align: center;
        }
        
        .responsive-table tbody td[data-title="Class"],
        .responsive-table thead th[data-title="Class"] {
            text-align: left;      
        }

        .responsive-table tbody td[data-title]:before {
            /*// Don’t show data-title labels*/
            content: none;
        }        
        
    }
    /* large table styles passed in from user! */    
        .responsive-table tbody td[data-title="Class"],
        .responsive-table tbody th[data-title="Class"] {
        
                            

        }

        .responsive-table {
            
        }

        .responsive-table thead tr th {
            
        }

    
    
</style>
    </head>
<body>
    <div>
        <!-- render table -->


    </div>
</body>
</html>
